name: Deploy Laravel Docker

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Gate the whole job on the host actually being reachable, BEFORE the
      # image build, for two reasons:
      #
      #  1. A dead host otherwise costs a full uncached build+push (minutes)
      #     before anyone finds out, and the real error lands buried under
      #     the build logs.
      #  2. ssh-action echoes the entire deploy script to the log (between its
      #     ======CMD====== / ======END====== markers) BEFORE it dials the
      #     host, so a connection failure prints directly after the script and
      #     reads as though the last command in it failed. It did not - nothing
      #     in the script ran at all. Probing here says plainly which half broke.
      #
      # If you would rather always publish the image even when the server is
      # down (so you can deploy by hand later), move this step back to just
      # above "Deploy on EC2 via SSH".
      - name: Wait for EC2 SSH to be reachable
        run: |
          HOST="${{ secrets.EC2_HOST }}"

          if [ -z "$HOST" ]; then
            echo "::error::EC2_HOST secret is empty. Set it to the instance's current public IP or DNS name."
            exit 1
          fi

          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY secret is empty. The SSH step would fail with a confusing auth error."
            exit 1
          fi

          for i in $(seq 1 10); do
            # `run:` executes under `bash -e`, so the probe must not be a bare
            # failing command or the first miss aborts the step instead of
            # retrying. `|| rc=$?` puts it in a tested context, which -e ignores.
            rc=0
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" 2>/dev/null || rc=$?

            if [ $rc -eq 0 ]; then
              echo "Port 22 reachable on attempt $i."
              exit 0
            fi

            if [ $rc -eq 124 ]; then
              echo "Attempt $i/10: packets dropped (no response) - retrying in 15s..."
            else
              echo "Attempt $i/10: connection refused - host is up but sshd is not listening. Retrying in 15s..."
            fi
            sleep 15
          done

          echo "::error::Cannot reach $HOST:22 after ~2.5 minutes - aborted before building the image."
          echo "An i/o timeout means the runner never reached the host at all. Check, in order:"
          echo "  1. The instance is running - a stopped instance loses its public IP unless an Elastic IP is attached."
          echo "  2. EC2_HOST still matches the instance's current public IP/DNS."
          echo "  3. The security group allows inbound TCP 22. GitHub-hosted runners use rotating IPs,"
          echo "     so a rule pinned to a single address will fail intermittently."
          echo "If port 80 on the same host is dead too, the box itself is down - not an SSH or firewall problem."
          echo "A refused connection instead means the host is reachable but sshd is not running."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ams_app:latest

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # Defaults are 30s to connect and 10m for the whole script. The script
          # below pulls an image, waits up to 90s for MySQL, migrates, then runs
          # six artisan commands - that can exceed 10m on a small instance, and
          # hitting the cap kills the deploy midway (potentially mid-migration).
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            APP_DIR=/home/ubuntu/asset_management_app

            mkdir -p $APP_DIR/nginx

            # Write docker-compose.yml directly - no SCP needed
            cat > $APP_DIR/docker-compose.yml << 'EOF'
            services:
              app:
                image: toladev1/ams_app:latest
                container_name: ams_app
                restart: always
                env_file:
                  - .env
                environment:
                  # Overrides whatever DB_* the APP_ENV secret's .env carries —
                  # these must always match the db service below verbatim, so
                  # they're pinned here instead of relying on the secret to
                  # stay in sync with it (a drift here previously caused the
                  # app to try a local socket connection instead of reaching
                  # the db container: "SQLSTATE[HY000] [2002] No such file or
                  # directory").
                  DB_CONNECTION: mysql
                  DB_HOST: db
                  DB_PORT: "3306"
                  DB_DATABASE: asset_management_db
                  DB_USERNAME: asset_management_user
                  DB_PASSWORD: asset_management_pass
                volumes:
                  - storage_data:/var/www/storage
                  - app_public:/var/www/public
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - laravel_net

              nginx:
                image: nginx:alpine
                container_name: ams_nginx
                restart: always
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - app_public:/var/www/public
                  - storage_data:/var/www/storage
                depends_on:
                  - app
                networks:
                  - laravel_net

              db:
                image: mysql:8.0
                container_name: asset_management_db
                restart: always
                environment:
                  MYSQL_DATABASE: asset_management_db
                  MYSQL_USER: asset_management_user
                  MYSQL_PASSWORD: asset_management_pass
                  MYSQL_ROOT_PASSWORD: root_pass
                volumes:
                  - dbdata:/var/lib/mysql
                networks:
                  - laravel_net
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
                  interval: 5s
                  timeout: 5s
                  retries: 10
                  start_period: 30s

            networks:
              laravel_net:
                driver: bridge

            volumes:
              dbdata:
              storage_data:
              app_public:
            EOF

            # Write nginx/default.conf directly - no SCP needed
            cat > $APP_DIR/nginx/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;

                root /var/www/public;
                index index.php index.html;

                # SPA deep links (/app/*) must reach Laravel's `spa` route, which
                # returns the SPA shell so vue-router can take over. Deliberately
                # NO `$uri/` here: with it, any /app path that matches a real
                # directory under public/app — e.g. a stale bundle dir
                # public/app/assets/, which collides with the SPA's own
                # /app/assets page — is answered by the index module with 403
                # "directory index is forbidden" instead of the app (a refresh of
                # /app/assets went 301 -> 403 in production while working locally,
                # where there is no public/app dir at all). See frontend/vite.config.js.
                location /app/ {
                    try_files $uri /index.php?$query_string;
                }

                location / {
                    try_files $uri $uri/ /index.php?$query_string;
                }

                location ~ \.php$ {
                    include fastcgi_params;
                    fastcgi_pass app:9000;
                    fastcgi_index index.php;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                    fastcgi_param PATH_INFO $fastcgi_path_info;
                }

                location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2|ttf)$ {
                    expires 30d;
                    access_log off;
                }

                location ~ /\.ht {
                    deny all;
                }
            }

            server {
                listen 80;
                server_name app.pepyasset.online;
                root /var/www/public;

                # API requests go straight to the Laravel app, same as the main site.
                location /api/ {
                    try_files $uri $uri/ /index.php?$query_string;
                }

                location ~ \.php$ {
                    include fastcgi_params;
                    fastcgi_pass app:9000;
                    fastcgi_index index.php;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                    fastcgi_param PATH_INFO $fastcgi_path_info;
                }

                # The SPA is built with base '/app/', so its own HTML/JS already
                # requests assets as /app/static/*, /app/favicon.png, etc. — root
                # stays at public/ (not public/app) so those paths resolve directly
                # without doubling up to /app/app/*. Anything without a matching
                # static file falls back to the SPA shell so vue-router's
                # history-mode client-side routing can take over (e.g. /app/login).
                location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2|ttf)$ {
                    try_files $uri =404;
                    expires 30d;
                    access_log off;
                }

                location / {
                    try_files $uri /app/index.html;
                }
            }
            EOF

            cd $APP_DIR

            # Rewritten on every deploy (not just the first) so config changes
            # to the APP_ENV secret — e.g. a rotated MAIL_PASSWORD — actually
            # reach the server instead of silently persisting whatever the
            # very first deploy happened to write.
            #
            # Written via a QUOTED heredoc, not `echo "..."`: the secret is
            # interpolated as literal script text, so with double quotes the
            # shell would expand any $VAR / backtick / backslash inside a value
            # (MAIL_PASSWORD and MAIL_FROM_NAME both contain such characters),
            # and a stray " would terminate the string and swallow later lines.
            # Remember the key already serving this box before we overwrite the
            # file, so an incomplete secret can't take the site down (see below).
            PREV_APP_KEY=$(grep -E '^APP_KEY=base64:.+' .env 2>/dev/null | head -n1 || true)

            cat > .env << 'ENVEOF'
            ${{ secrets.APP_ENV }}
            ENVEOF

            # The secret is usually pasted from a Windows file. Compose's
            # env_file parser does NOT strip \r, so every value would arrive
            # with a trailing carriage return (a malformed APP_KEY, a password
            # that silently fails to authenticate, etc.).
            sed -i 's/\r$//' .env

            # A .env with no APP_KEY makes Laravel throw MissingAppKeyException on
            # every single request - a total outage - and that has now happened
            # three times because the secret is empty. Rather than faithfully
            # reproducing the outage, carry forward the key already on the server
            # and shout about it. Only abort when there is no key anywhere to use.
            if ! grep -qE '^APP_KEY=base64:.+' .env; then
              if [ -n "$PREV_APP_KEY" ]; then
                echo "::warning::APP_ENV secret has no APP_KEY - reusing the key already on this server. Fix the secret: every other value in it is missing too."
                echo "$PREV_APP_KEY" >> .env
              else
                echo "::error::APP_ENV secret has no valid APP_KEY and this server has no previous key to fall back on - aborting before the deploy breaks production."
                exit 1
              fi
            fi

            # Not fatal, but each of these fails SILENTLY in production rather
            # than throwing: a missing MAIL_MAILER falls back to the "log"
            # driver (notification emails get written to laravel.log and never
            # delivered), and a missing APP_URL makes url()/route() resolve to
            # http://localhost in scheduled commands and CLI-generated QR codes.
            # Both went unnoticed in production for weeks.
            for required in APP_URL MAIL_MAILER MAIL_HOST MAIL_USERNAME MAIL_PASSWORD; do
              grep -qE "^${required}=.+" .env || echo "::warning::APP_ENV secret is missing ${required} - production will fall back to a framework default."
            done

            # Reclaim disk BEFORE pulling, so a nearly-full volume cannot fail
            # the pull halfway. Every deploy pulls a fresh :latest and orphans
            # the previous image's layers, and nothing has cleaned those up
            # since commit 50fd0b8 dropped the original `docker image prune -f`
            # (118 commits ago). A full root volume takes the whole box down -
            # sshd included, which is how you lose SSH and EC2 Instance Connect
            # at the same moment and cannot get in to clear the space.
            #
            # Dangling-only, deliberately NOT `-a`: tagged images and anything
            # a running container references are left untouched.
            echo "--- disk before prune ---"
            df -h /
            docker image prune -f
            echo "--- disk after prune ---"
            df -h /
            DISK_PCT=$(df --output=pcent / 2>/dev/null | tr -dc '0-9' || true)
            if [ "${DISK_PCT:-0}" -ge 85 ]; then
              echo "::warning::Root volume is ${DISK_PCT}% full even after pruning - investigate before it takes the instance down."
            fi
            # Only pull app/nginx here so the pinned mysql image never changes
            # underneath a running db container on a routine deploy.
            docker compose pull app nginx

            # The app/nginx services share a named volume (app_public) mounted at
            # /var/www/public so nginx can serve static files without proxying
            # everything through PHP. Docker only seeds a named volume from the
            # image the FIRST time it's created — it does NOT resync on later
            # deploys, so every subsequent image update (new SPA build, new
            # favicon, etc.) was silently invisible in production while the
            # volume kept serving whatever was baked in on day one. Re-sync the
            # volume from the freshly pulled image before starting containers.
            #
            # public/app (the SPA build) is REPLACED, not merged: `cp -a` only
            # adds and overwrites, so anything a newer build no longer emits kept
            # living in the volume forever — every old hashed bundle, and the
            # pre-rename public/app/assets/ directory that shadowed the SPA's own
            # /app/assets route and made a refresh there return nginx 403. The
            # directory is pure build output (Dockerfile copies frontend/dist into
            # it), so deleting it before the copy is safe; if the copy then fails
            # the step fails loudly rather than silently serving a stale app.
            echo "Syncing public/ assets from the new image into the shared volume..."
            PUBLIC_VOLUME=$(docker volume ls --filter name=app_public --format '{{.Name}}' | head -n1)
            if [ -n "$PUBLIC_VOLUME" ]; then
              docker run --rm -v "$PUBLIC_VOLUME":/target toladev1/ams_app:latest \
                sh -c "rm -rf /target/app && cp -a /var/www/public/. /target/ && chown -R www-data:www-data /target"
              echo "Synced into volume: $PUBLIC_VOLUME"
            else
              echo "No existing app_public volume found (first deploy) — image content will seed it normally."
            fi

            docker compose up -d --remove-orphans

            echo "Waiting for database to accept connections from the app container..."
            DB_READY=0
            for i in $(seq 1 30); do
              if docker compose exec -T app php -r "
                try { new PDO('mysql:host='.getenv('DB_HOST').';port='.getenv('DB_PORT'), getenv('DB_USERNAME'), getenv('DB_PASSWORD')); exit(0); }
                catch (Exception \$e) { fwrite(STDERR, \$e->getMessage().PHP_EOL); exit(1); }
              "; then
                echo "Database is reachable (attempt $i)."
                DB_READY=1
                break
              fi
              echo "Attempt $i/30: database not reachable yet, retrying in 3s..."
              sleep 3
            done

            if [ "$DB_READY" != "1" ]; then
              echo "Database still unreachable after 90s. Diagnostics:"
              docker compose ps
              echo "--- db health ---"
              docker inspect --format '{{json .State.Health}}' asset_management_db || true
              echo "--- db logs (last 100 lines) ---"
              docker logs asset_management_db --tail 100 || true
              exit 1
            fi

            docker compose exec -T app php artisan storage:link || true
            docker compose exec -T app php artisan migrate --force

            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear
            docker compose exec -T app php artisan view:clear

            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            echo "Deploy complete."
