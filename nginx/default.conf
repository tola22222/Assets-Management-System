server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA deep links (/app/*) must reach Laravel's `spa` route, which returns the
    # SPA shell so vue-router can take over. Deliberately NO `$uri/` here: with
    # it, any /app path matching a real directory under public/app (e.g. a stale
    # bundle dir public/app/assets/, which collides with the SPA's own
    # /app/assets page) is answered by the index module with 403 "directory index
    # is forbidden" instead of the app. See frontend/vite.config.js.
    location /app/ {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name app.pepyasset.online;
    root /var/www/public;

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        root /var/www/public/app;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2|ttf)$ {
        root /var/www/public/app;
        expires 30d;
        access_log off;
    }
}
