<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Project Modal</title>
  <style>
    :root {
      --bg-page: #F8F9FA;
      --card-bg: #FFFFFF;
      --icon-circle-bg: #EBF3FF;
      --icon-color: #3B82F6;
      --text-title: #000000;
      --text-body: #64748B;
      --btn-cancel-bg: #F8FAFC;
      --btn-cancel-text: #1E293B;
      --btn-cancel-hover: #F1F5F9;
      --btn-delete-bg: #4F86F7;
      --btn-delete-text: #FFFFFF;
      --btn-delete-hover: #3B75E6;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-page);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Modal Backdrop / Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    /* Delete Dialog Card */
    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 32px 28px 28px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Soft Blue Trash Icon Container */
    .icon-container {
      width: 56px;
      height: 56px;
      background-color: var(--icon-circle-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .icon-container svg {
      width: 24px;
      height: 24px;
      stroke: var(--icon-color);
      stroke-width: 2;
    }

    /* Title & Description */
    .modal-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-title);
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .modal-description {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-body);
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 280px;
    }

    /* Action Buttons */
    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-cancel {
      background-color: var(--btn-cancel-bg);
      color: var(--btn-cancel-text);
    }

    .btn-cancel:hover {
      background-color: var(--btn-cancel-hover);
    }

    .btn-delete {
      background-color: var(--btn-delete-bg);
      color: var(--btn-delete-text);
    }

    .btn-delete:hover {
      background-color: var(--btn-delete-hover);
    }
  </style>
</head>
<body>

  <div class="modal-overlay">
    <div class="modal-card">
      
      <div class="icon-container">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>

      <h3 class="modal-title">Delete Project</h3>
      <p class="modal-description">You're going to delete this “Demo” project. Are you sure?</p>

      <div class="modal-actions">
        <button type="button" class="btn btn-cancel">No. Keep it</button>
        <button type="button" class="btn btn-delete">Confirm Delete</button>
      </div>

    </div>
  </div>

</body>
</html>
