; Baked into the PHP-FPM image (see Dockerfile). The stock php:*-fpm image
; ships no php.ini, so PHP's built-in default applied: 2M per uploaded file.
; A phone photo is usually 2-5 MB, so the QR scan's Take photo (and asset,
; staff and supplier photos) were refused before the app saw them.
;
; 5 MB per file and no more — the same limit the app shows the user ("That
; image is larger than 5MB"). nginx is set to the same 5M (deploy workflow and
; nginx/default.conf). Uploaded photos over 1 MB are then compressed by
; App\Services\ImageCompressor.
upload_max_filesize = 5M
