<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Toast Notification</title>
  <style>
    :root {
      --toast-bg: rgba(14, 27, 49, 0.85);
      --toast-border: rgba(255, 255, 255, 0.08);
      --toast-glow-border: #00E676;
      --icon-bg: #00E676;
      --icon-check: #0A192F;
      --text-heading: #FFFFFF;
      --text-sub: #94A3B8;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: #0B132B;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Outer Wrapper for Stacked Shadow Effect */
    .toast-wrapper {
      position: relative;
      width: 100%;
      max-width: 460px;
    }

    /* Back Layer Fake Shadow Card */
    .toast-layer-back {
      position: absolute;
      top: 8px;
      left: 12px;
      right: -8px;
      bottom: -8px;
      background: rgba(10, 22, 40, 0.6);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      z-index: 1;
      pointer-events: none;
    }

    /* Main Toast Popup Card */
    .toast-card {
      position: relative;
      z-index: 2;
      background: var(--toast-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid var(--toast-border);
      
      /* Glowing green left accent border */
      border-left: 3px solid var(--toast-glow-border);
    }

    /* Checkmark Circle Icon */
    .toast-icon-container {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
    }

    .toast-icon-container svg {
      width: 16px;
      height: 16px;
      stroke: var(--icon-check);
      stroke-width: 3;
    }

    /* Text Content */
    .toast-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toast-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .toast-message {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-sub);
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="toast-wrapper">
    <div class="toast-layer-back"></div>

    <div class="toast-card">
      <div class="toast-icon-container">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="toast-content">
        <h4 class="toast-title">Export Started</h4>
        <p class="toast-message">Your PDF download will begin shortly.</p>
      </div>
    </div>
  </div>

</body>
</html>
