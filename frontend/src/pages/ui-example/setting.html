<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Appearance</title>
  <style>
    :root {
      --primary: #444CE7;
      --primary-hover: #3538CD;
      --bg-page: #FFFFFF;
      --bg-card: #F9FAFB;
      --border-color: #EAECF0;
      --border-selected: #444CE7;
      --text-main: #101828;
      --text-muted: #475467;
      --text-subtle: #667085;
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .settings-container {
      width: 100%;
      max-width: 960px;
    }

    /* Header Nav Tabs */
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-subtle);
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #F2F4F7;
      color: var(--text-main);
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
    }

    .section-subtitle {
      font-size: 14px;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    .external-link {
      font-size: 14px;
      color: var(--text-subtle);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Form Rows */
    .form-row {
      display: grid;
      grid-template-columns: 240px 1fr;
      padding: 24px 0;
      border-top: 1px solid var(--border-color);
    }

    .label-group {
      padding-right: 16px;
    }

    .label-group label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      display: block;
    }

    .label-desc {
      font-size: 14px;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    .link-action {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary);
      text-decoration: none;
      margin-top: 8px;
    }

    /* Color Input */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background-color: var(--primary);
    }

    .color-input {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 14px;
      width: 120px;
      color: var(--text-main);
    }

    /* Dropdown */
    .select-dropdown {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      width: 240px;
      background: #FFF;
      color: var(--text-main);
      cursor: pointer;
    }

    /* Selection Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card-option {
      position: relative;
      cursor: pointer;
    }

    .card-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .card-preview {
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-card);
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card-option input[type="radio"]:checked + .card-preview {
      border-color: var(--border-selected);
      box-shadow: 0 0 0 1px var(--border-selected);
    }

    .check-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 18px;
      height: 18px;
      background-color: var(--primary);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .check-badge::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    .card-option input[type="radio"]:checked + .card-preview .check-badge {
      display: flex;
    }

    .card-info {
      margin-top: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    /* Mock UI Previews */
    .mock-wireframe {
      width: 80%;
      height: 70%;
      background: #FFF;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mock-line {
      height: 6px;
      background: #EAECF0;
      border-radius: 3px;
      width: 100%;
    }

    .mock-line.accent {
      background: var(--primary);
      width: 40%;
    }

    .btn-css {
      background: #FFF;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* Footer Buttons */
    .form-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-cancel {
      background: #FFF;
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn-save {
      background: var(--primary);
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      color: #FFF;
      cursor: pointer;
    }

    .btn-save:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="settings-container">
    <h1>Settings</h1>

    <div class="nav-tabs">
      <button class="tab-btn">Account</button>
      <button class="tab-btn">Profile</button>
      <button class="tab-btn">Security</button>
      <button class="tab-btn active">Appearance</button>
      <button class="tab-btn">Notifications</button>
      <button class="tab-btn">Billing</button>
      <button class="tab-btn">Integrations</button>
    </div>

    <div class="section-header">
      <div>
        <div class="section-title">Appearance</div>
        <div class="section-subtitle">Change how your public dashboard looks and feels.</div>
      </div>
      <a href="#" class="external-link">dashboard.untitledui.com ↗</a>
    </div>

    <form>
      <div class="form-row">
        <div class="label-group">
          <label for="brand-color">Brand color</label>
          <div class="label-desc">Select or customize your brand color.</div>
        </div>
        <div class="color-picker-wrapper">
          <div class="color-swatch"></div>
          <input type="text" id="brand-color" class="color-input" value="# 444CE7">
        </div>
      </div>

      <div class="form-row">
        <div class="label-group">
          <label>Dashboard charts</label>
          <div class="label-desc">How charts are displayed.</div>
          <a href="#" class="link-action">View examples</a>
        </div>
        <div class="cards-grid">
          <label class="card-option">
            <input type="radio" name="chart_type" value="default" checked>
            <div class="card-preview">
              <div class="check-badge"></div>
              <div class="mock-wireframe">
                <div class="mock-line accent"></div>
                <div class="mock-line"></div>
                <div class="mock-line"></div>
              </div>
            </div>
            <div class="card-info">
              <div class="card-title">Default</div>
              <div class="card-desc">Default company branding.</div>
            </div>
          </label>

          <label class="card-option">
            <input type="radio" name="chart_type" value="simplified">
            <div class="card-preview">
              <div class="check-badge"></div>
              <div class="mock-wireframe">
                <div class="mock-line"></div>
                <div class="mock-line"></div>
              </div>
            </div>
            <div class="card-info">
              <div class="card-title">Simplified</div>
              <div class="card-desc">Minimal and modern.</div>
            </div>
          </label>

          <label class="card-option">
            <input type="radio" name="chart_type" value="custom">
            <div class="card-preview">
              <button type="button" class="btn-css">&lt;/&gt; Edit CSS</button>
            </div>
            <div class="card-info">
              <div class="card-title">Custom CSS</div>
              <div class="card-desc">Manage styling with CSS.</div>
            </div>
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="label-group">
          <label for="language">Language</label>
          <div class="label-desc">Default language for public dashboard.</div>
        </div>
        <div>
          <select id="language" class="select-dropdown">
            <option>🇬🇧 English (UK)</option>
            <option>🇺🇸 English (US)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="label-group">
          <label>Cookie banner</label>
          <div class="label-desc">Display cookie banners to visitors.</div>
          <a href="#" class="link-action">View examples</a>
        </div>
        <div class="cards-grid">
          <label class="card-option">
            <input type="radio" name="cookie_banner" value="default" checked>
            <div class="card-preview">
              <div class="check-badge"></div>
              <div class="mock-wireframe">
                <div class="mock-line accent" style="height: 12px;"></div>
              </div>
            </div>
            <div class="card-info">
              <div class="card-title">Default</div>
              <div class="card-desc">Cookie controls for visitors.</div>
            </div>
          </label>

          <label class="card-option">
            <input type="radio" name="cookie_banner" value="simplified">
            <div class="card-preview">
              <div class="check-badge"></div>
              <div class="mock-wireframe">
                <div class="mock-line accent" style="width: 20%; height: 8px;"></div>
              </div>
            </div>
            <div class="card-info">
              <div class="card-title">Simplified</div>
              <div class="card-desc">Show a simplified banner.</div>
            </div>
          </label>

          <label class="card-option">
            <input type="radio" name="cookie_banner" value="none">
            <div class="card-preview">
              <div class="mock-wireframe" style="background: transparent; border: none;"></div>
            </div>
            <div class="card-info">
              <div class="card-title">None</div>
              <div class="card-desc">Don't show any banners.</div>
            </div>
          </label>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-save">Save changes</button>
      </div>
    </form>
  </div>

</body>
</html>
